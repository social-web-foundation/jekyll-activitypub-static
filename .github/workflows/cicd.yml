name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rake lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  build:
    name: Build gem
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z: $GITHUB_REF_NAME"
            exit 1
          fi

          gem_version="$(ruby -Ilib -rjekyll/activitypub_static/version -e 'print Jekyll::ActivityPubStatic::VERSION')"
          if [[ "$GITHUB_REF_NAME" != "v$gem_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gem version v$gem_version"
            exit 1
          fi

      - name: Build gem
        run: bundle exec rake build

      - name: Upload gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem
          path: pkg/*.gem

  example:
    name: Build example site
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Download gem artifact
        uses: actions/download-artifact@v4
        with:
          name: gem
          path: pkg

      - name: Install built gem
        run: gem install pkg/*.gem

      - name: Build example site
        run: jekyll build --source example-site --destination example-site/_site --trace

  publish:
    name: Publish gem
    runs-on: ubuntu-latest
    needs: example
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Download gem artifact
        uses: actions/download-artifact@v4
        with:
          name: gem
          path: pkg

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gem
        run: gem push pkg/*.gem
