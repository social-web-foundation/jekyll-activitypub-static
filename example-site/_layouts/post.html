<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    {% if page.activitypub_url %}
      <link rel="alternate" type="application/activity+json" href="{{ page.activitypub_url }}">
    {% endif %}
  </head>
  <body>
    <main>
      <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
      </article>
    </main>
  </body>
</html>
